name: README assets

# Redraws the profile README's live images - the stats strip and the
# contribution graph - and publishes them to the `output` branch. Nothing is
# committed to main, so this never triggers a portfolio redeploy.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/readme/**"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: .github/readme/package-lock.json

      - name: Draw stats strip
        working-directory: .github/readme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          npm ci --no-audit --no-fund
          npm run stats

      - name: Draw contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-light.svg?color_snake=#E8241C&color_dots=#EBEDF0,#F9C9C5,#F2847C,#E8241C,#A3150F
            dist/contributions-dark.svg?palette=github-dark&color_snake=#E8241C&color_dots=#161B22,#4A1512,#8E1D17,#E8241C,#FF6B61

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
